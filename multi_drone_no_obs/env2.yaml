# Example environment with 12 drones (no obstacles)
bounds:
  x: [0, 50]   # x-bounds
  y: [0, 50]   # y-bounds
  z: [0, 50]   # z-bounds

# Initial positions (K=12)
initial_configuration:
  - [5, 5, 2]    # Drone 1
  - [8, 5, 2]    # Drone 2
  - [11, 5, 2]   # Drone 3
  - [14, 5, 2]   # Drone 4
  - [17, 5, 2]   # Drone 5
  - [20, 5, 2]   # Drone 6
  - [5, 8, 2]    # Drone 7
  - [8, 8, 2]    # Drone 8
  - [11, 8, 2]   # Drone 9
  - [14, 8, 2]   # Drone 10
  - [17, 8, 2]   # Drone 11
  - [20, 8, 2]   # Drone 12

# No obstacles
obstacles: []

# Goal regions (one per drone, index-matched)
goals:
  - position: [35, 35, 2]  # Goal for Drone 1
    radius: 1.0
  - position: [38, 35, 2]  # Goal for Drone 2
    radius: 1.0
  - position: [41, 35, 2]  # Goal for Drone 3
    radius: 1.0
  - position: [44, 35, 2]  # Goal for Drone 4
    radius: 1.0
  - position: [47, 35, 2]  # Goal for Drone 5
    radius: 1.0
  - position: [35, 38, 2]  # Goal for Drone 6
    radius: 1.0
  - position: [38, 38, 2]  # Goal for Drone 7
    radius: 1.0
  - position: [41, 38, 2]  # Goal for Drone 8
    radius: 1.0
  - position: [44, 38, 2]  # Goal for Drone 9
    radius: 1.0
  - position: [35, 41, 2]  # Goal for Drone 10
    radius: 1.0
  - position: [38, 41, 2]  # Goal for Drone 11
    radius: 1.0
  - position: [41, 41, 2]  # Goal for Drone 12
    radius: 1.0
