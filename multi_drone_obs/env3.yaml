# ===== Bounds =====
bounds:
  x: [0, 60]
  y: [0, 60]
  z: [0, 60]

# ===== Initial positions (K=12) =====
# Two rows in the south, z=3 (well clear of obstacles)
initial_configuration:
  - [8,  8, 3]    # 1
  - [14, 8, 3]    # 2
  - [20, 8, 3]    # 3
  - [26, 8, 3]    # 4
  - [32, 8, 3]    # 5
  - [38, 8, 3]    # 6
  - [8, 12, 3]    # 7
  - [14,12, 3]    # 8
  - [20,12, 3]    # 9
  - [26,12, 3]    # 10
  - [32,12, 3]    # 11
  - [38,12, 3]    # 12

# ===== Obstacles =====
# Two staggered walls built from thin boxes (height ~6), with offset gaps for weaving
# Wall 1 (y ≈ 24) — gap roughly x ∈ [24, 36]
obstacles:
- type: box
  position: [12, 24, 3]   # covers x ∈ [2, 22]
  size: [20, 2, 6]
  rotation: [0, 0, 0]
  color: "red"
- type: box
  position: [48, 24, 3]   # covers x ∈ [38, 58]
  size: [20, 2, 6]
  rotation: [0, 0, 0]
  color: "red"

# Wall 2 (y ≈ 36) — gap roughly x ∈ [14, 26] (offset from Wall 1)
- type: box
  position: [6, 36, 3]    # covers x ∈ [-4, 16] (clamped by bounds at 0)
  size: [20, 2, 6]
  rotation: [0, 0, 0]
  color: "red"
- type: box
  position: [30, 36, 3]   # covers x ∈ [20, 40]
  size: [20, 2, 6]
  rotation: [0, 0, 0]
  color: "red"
- type: box
  position: [54, 36, 3]   # covers x ∈ [44, 64] (clamped by bounds at 60)
  size: [20, 2, 6]
  rotation: [0, 0, 0]
  color: "red"

# Central narrowing to encourage micro-detours
- type: cylinder
  endpoints: [[30, 30, 0], [30, 30, 10]]
  radius: 2.0
  rotation: [0, 0, 0]
  color: "red"

# ===== Goals (two rows in the north) =====
